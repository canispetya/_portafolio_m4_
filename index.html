<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pokédex interactiva con HTML, CSS y JavaScript.">
  <title>PETYADEX</title>
  
  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
            orbitron: ['Orbitron', 'sans-serif'],
          },
          animation: {
            'float-bg': 'float-bg 8s ease-in-out infinite',
          }
        }
      }
    }
  </script>
  
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 text-white relative font-inter custom-scrollbar">

  <!-- Ambient background particles -->
  <div class="fixed inset-0 pointer-events-none z-0">
    <div class="absolute top-[10%] left-[15%] w-64 h-64 bg-red-500/5 rounded-full blur-3xl animate-float-bg"></div>
    <div class="absolute top-[60%] right-[10%] w-80 h-80 bg-blue-500/5 rounded-full blur-3xl animate-float-bg" style="animation-delay: 2s"></div>
    <div class="absolute bottom-[20%] left-[40%] w-72 h-72 bg-purple-500/5 rounded-full blur-3xl animate-float-bg" style="animation-delay: 4s"></div>
  </div>

  <!-- Main Pokédex Shell -->
  <div class="relative z-10 max-w-5xl mx-auto my-4 md:my-8 px-4">
    <div class="pokedex-shell bg-gradient-to-b from-red-700 via-red-800 to-red-950 rounded-3xl shadow-[0_20px_80px_rgba(0,0,0,0.7),inset_0_2px_0_rgba(255,255,255,0.1)] border-4 border-red-950/80 transition-transform duration-500 hover:shadow-[0_25px_90px_rgba(0,0,0,0.8)]">
      
      <!-- Header -->
      <header class="flex flex-col sm:flex-row items-center justify-between px-6 py-6 sm:py-4 border-b-4 border-black/30 bg-gradient-to-r from-red-800 to-red-600 gap-4 sm:gap-0">
        <div class="flex items-center gap-4 w-full sm:w-auto justify-center sm:justify-start">
          <div class="relative flex-shrink-0">
            <div class="w-14 h-14 rounded-full border-4 border-gray-200 bg-cyan-400 shadow-[inset_-4px_-4px_8px_rgba(0,0,0,0.4),0_0_20px_rgba(34,211,238,0.6)] animate-pulse"></div>
            <div class="absolute top-1 left-3 w-4 h-2 bg-white/40 rounded-full rotate-[-45deg]"></div>
          </div>
          <div class="flex flex-col items-center sm:items-start text-center sm:text-left">
            <h1 onclick="window.location.reload()" class="text-3xl font-black italic tracking-tighter text-white font-orbitron leading-none cursor-pointer hover:text-cyan-400 transition-colors">PETYADEX</h1>
            <a href="https://pokeapi.co/" target="_blank" class="text-[9px] font-bold text-white/60 hover:text-white uppercase tracking-widest mt-0.5 transition-colors">Powered with PokeAPI</a>
          </div>
          <div class="hidden xs:flex gap-2 ml-2">
            <div class="w-4 h-4 rounded-full bg-red-500 border-2 border-black/20 shadow-lg animate-led-pulse"></div>
            <div class="w-4 h-4 rounded-full bg-yellow-400 border-2 border-black/20 shadow-lg"></div>
            <div class="w-4 h-4 rounded-full bg-green-500 border-2 border-black/20 shadow-lg"></div>
          </div>
        </div>
        <button onclick="loadPokedex()" class="px-6 py-2 sm:px-4 sm:py-1.5 rounded-lg bg-black/20 hover:bg-black/40 text-[11px] sm:text-[10px] font-black uppercase tracking-widest text-white/80 border border-white/10 transition-all hover:scale-105 active:scale-95 shadow-lg">
          RECARGAR
        </button>
      </header>

      <!-- Screen Container -->
      <div class="m-4 md:m-6 rounded-2xl bg-gray-300 p-2 md:p-3 shadow-[inset_0_0_30px_rgba(0,0,0,0.4)] rounded-bl-[40px]">
        <div class="bg-gray-950 rounded-xl p-4 md:p-6 border-[6px] border-gray-900 shadow-[inset_0_0_40px_rgba(0,0,0,0.9)]">
          
          <!-- Search & Filters -->
          <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8 sticky top-0 z-20 bg-gray-950 py-2">
            <div class="relative group flex-1 max-w-xl">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none group-focus-within:text-cyan-400 text-cyan-400/50 transition-colors">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              </div>
              <input 
                type="text" 
                id="search-input"
                placeholder="ESCANEO DE ADN POKÉMON..." 
                class="w-full bg-cyan-950/20 border-2 border-cyan-500/30 rounded-2xl py-4 pl-14 pr-12 focus:outline-none focus:ring-4 focus:ring-cyan-500/20 focus:border-cyan-400 backdrop-blur-xl transition-all font-black text-lg placeholder:text-cyan-500/20 text-cyan-300 shadow-[0_0_20px_rgba(0,0,0,0.5),inset_0_0_10px_rgba(34,211,238,0.1)] group-hover:border-cyan-500/50 hover:bg-cyan-900/10 uppercase tracking-widest outline-none"
              >
              <button 
                id="clear-search"
                class="absolute inset-y-0 right-0 pr-4 flex items-center opacity-0 pointer-events-none transition-all hover:text-red-400 text-cyan-500/50"
              >
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
            </div>
          </div>

          <!-- Error & Loading -->
          <div id="error-container" class="mb-4 text-center text-red-400 text-sm"></div>
          
          <div id="loader" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="h-64 bg-gray-800 animate-pulse rounded-2xl"></div>
            <div class="h-64 bg-gray-800 animate-pulse rounded-2xl"></div>
            <div class="h-64 bg-gray-800 animate-pulse rounded-2xl"></div>
          </div>

          <!-- Content Grid -->
          <div id="featured-container" class="mb-8"></div>
          <div id="pokemon-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>

        </div>
      </div>

      <!-- Footer Buttons -->
      <div class="flex items-center justify-around px-8 py-6 bg-gradient-to-r from-red-950 via-red-900 to-red-950 border-t-4 border-black/40 shadow-[inset_0_4px_15px_rgba(0,0,0,0.4)]">
        <!-- Search Button Wrapper -->
        <a href="#search-input" class="flex flex-col items-center gap-2 group transition-all" title="Buscar Pokémon">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-gray-600 to-gray-900 border-2 border-gray-700 shadow-[0_4px_10px_rgba(0,0,0,0.6)] group-hover:scale-110 group-active:scale-90 transition-transform"></div>
          <span class="text-[10px] font-black uppercase tracking-[0.2em] text-white/40 group-hover:text-cyan-400 transition-colors">buscar</span>
        </a>

        <!-- Reload Button Wrapper -->
        <button onclick="loadPokedex()" class="flex flex-col items-center gap-2 group transition-all" title="Recargar lista">
          <div class="relative w-16 h-16 bg-gray-800 rounded-full border-4 border-black/20 flex items-center justify-center shadow-[0_4px_15px_rgba(0,0,0,0.6)] group-hover:scale-110 group-active:scale-90 transition-transform">
            <div class="w-10 h-2 bg-gray-700 absolute rounded-full"></div>
            <div class="w-2 h-10 bg-gray-700 absolute rounded-full"></div>
          </div>
          <span class="text-[10px] font-black uppercase tracking-[0.2em] text-white/40 group-hover:text-cyan-400 transition-colors">recargar</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Modal -->
  <div id="pokemon-modal" class="fixed inset-0 z-[100] hidden">
    <div onclick="closeModal()" class="modal-overlay absolute inset-0 bg-black/0 backdrop-blur-0 transition-all duration-300"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4 md:p-8 pointer-events-none">
      <div id="modal-body" class="modal-content relative w-full max-w-lg h-[90vh] md:h-[80vh] pointer-events-auto transform translate-y-10 opacity-0 transition-all duration-300">
        <!-- Content injected by app.js -->
      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
